[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/aver005/craws"

[workspace.dependencies]
craws-domain = { path = "crates/craws-domain" }
craws-engine = { path = "crates/craws-engine" }
craws-codecs = { path = "crates/craws-codecs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
rayon = "1"
# default-features off everywhere: codecs opt into formats
image = { version = "0.25", default-features = false }
# fast pure-Rust SIMD jpeg encoder (image's own encoder is ~7x slower than its decode)
jpeg-encoder = { version = "0.7", features = ["simd"] }
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
tempfile = "3"
# MCP server (craws-mcp)
rmcp = { version = "2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# benches must measure what users get
[profile.bench]
lto = "thin"
codegen-units = 1
