name: CI

# One pipeline, staged — no second workflow, no duplicated "Build" jobs.
#
#   PR / push to main   →  gate + app        (fast feedback, no artifacts)
#   push to develop     →  gate + app  →  release build (3 OS)  →  publish
#
# The BLAZING gate lives in `gate` (clippy 0-warnings · test · bench-compile)
# and `app` (the Tauri shell). Tests run on Linux only — the release build
# still compiles craws on Windows/macOS, so platform compile breaks surface
# there. (rustfmt is intentionally not gated — owner's call.)
#
# The rolling `v<workspace-version>-dev` release ships, per platform, BOTH
# CLI binaries (`craws` + `craws-mcp`) and a desktop installer (nsis / dmg /
# deb+appimage). Release notes: scripts/dev-release.template.md via
# scripts/render-release-notes.sh (shared with .gitlab-ci.yml).

on:
  pull_request:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '.memories/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: Gate — clippy · test · bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy — the contract says zero warnings
        run: cargo clippy --workspace --exclude craws-app --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude craws-app --locked
      - name: Benches still compile
        run: cargo bench --workspace --exclude craws-app --no-run --locked

  app:
    name: Tauri shell — clippy · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Frontend — typecheck then build (craws-app embeds app/dist)
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
      - name: Clippy the shell
        run: cargo clippy -p craws-app --all-targets --locked -- -D warnings
      - name: Build the shell
        run: cargo build -p craws-app --locked

  # ---- develop only: build + publish the rolling dev release --------------
  release-build:
    name: Release build (${{ matrix.target }})
    needs: [gate, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
          - os: ubuntu-latest
            target: linux-x86_64
            bundles: deb,appimage
          - os: macos-latest
            target: macos-arm64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ''   # ship even if a dep warns; the gate already enforced ours
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2

      # --- CLI binaries: craws + craws-mcp -------------------------------
      - name: Build CLI binaries
        run: cargo build --release --locked -p craws-cli -p craws-mcp

      - name: Package CLI archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist stage
          cp target/release/craws target/release/craws-mcp stage/
          strip stage/craws stage/craws-mcp || true
          tar -C stage -czf dist/craws-${{ matrix.target }}.tar.gz craws craws-mcp

      - name: Package CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/craws.exe stage/
          Copy-Item target/release/craws-mcp.exe stage/
          Compress-Archive -Path stage/* -DestinationPath dist/craws-${{ matrix.target }}.zip

      # --- Desktop installer: the Tauri shell ----------------------------
      - uses: oven-sh/setup-bun@v2
      - name: Build the frontend
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Bundle desktop installer
        working-directory: crates/craws-app
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect installers (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: Collect installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: craws-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish dev build
    needs: release-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Compute rolling tag from workspace version
        id: ver
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-dev" >> "$GITHUB_OUTPUT"

      - name: Capture previous dev-build commit
        id: prev
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            PREV_SHA=$(git rev-parse "refs/tags/$TAG")
            echo "sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
            echo "label=\`$TAG\` (\`$(printf '%s' "$PREV_SHA" | cut -c1-8)\`)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "label=(none — first dev build)" >> "$GITHUB_OUTPUT"
          fi

      - name: Move tag to current commit
        shell: bash
        run: |
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}" --force

      - name: Delete previous release for this tag (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.ver.outputs.tag }}" --yes || true

      - name: Compute changelog since previous dev build
        id: log
        shell: bash
        run: |
          PREV="${{ steps.prev.outputs.sha }}"
          if [ -n "$PREV" ] && [ "$PREV" != "${{ github.sha }}" ]; then
            RANGE="$PREV..${{ github.sha }}"
            COUNT=$(git rev-list --count "$RANGE")
            FILES=$(git diff --name-only "$RANGE" | wc -l | tr -d ' ')
            LOG=$(git log --pretty=format:'- %s (`%h`)' "$RANGE")
            CONTRIBUTORS=$(git log --pretty=format:'%an' "$RANGE" | sort -u | awk 'NR>1{printf ", "}{printf "%s", $0}')
          else
            COUNT=0
            FILES=0
            LOG="_First dev build — no prior history to diff against._"
            CONTRIBUTORS="—"
          fi
          {
            echo "count=$COUNT"
            echo "files=$FILES"
            echo "contributors=$CONTRIBUTORS"
            echo "log<<GHA_EOF_LOG"
            echo "$LOG"
            echo "GHA_EOF_LOG"
          } >> "$GITHUB_OUTPUT"

      - name: Compute artifact list
        id: artifacts
        shell: bash
        run: |
          cd release-assets
          COUNT=$(ls -1 | wc -l | tr -d ' ')
          LIST=$(for f in *; do printf -- '- `%s` (%s)\n' "$f" "$(du -h "$f" | cut -f1)"; done)
          {
            echo "count=$COUNT"
            echo "list<<GHA_EOF_ARTIFACTS"
            echo "$LIST"
            echo "GHA_EOF_ARTIFACTS"
          } >> "$GITHUB_OUTPUT"

      - name: Render release notes
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.label }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          PUSHED_BY: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_COUNT_SINCE_LAST_BUILD: ${{ steps.log.outputs.count }}
          COMMITS_SINCE_LAST_BUILD: ${{ steps.log.outputs.log }}
          CONTRIBUTORS_SINCE_LAST_BUILD: ${{ steps.log.outputs.contributors }}
          CHANGED_FILES_COUNT: ${{ steps.log.outputs.files }}
          ARTIFACT_COUNT: ${{ steps.artifacts.outputs.count }}
          ARTIFACT_LIST: ${{ steps.artifacts.outputs.list }}
        run: |
          export COMMIT_SHORT_SHA="$(printf '%s' "$COMMIT_SHA" | cut -c1-8)"
          export COMMIT_TITLE="$(printf '%s\n' "$COMMIT_MESSAGE" | head -1)"
          export RUST_VERSION="$(rustc --version)"
          export BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          chmod +x scripts/render-release-notes.sh
          scripts/render-release-notes.sh scripts/dev-release.template.md release-body.md \
            TAG VERSION PREVIOUS_TAG BRANCH REPO REPO_URL \
            COMMIT_SHA COMMIT_SHORT_SHA COMMIT_TITLE COMMIT_MESSAGE \
            COMMIT_AUTHOR_NAME COMMIT_AUTHOR_EMAIL COMMIT_TIMESTAMP \
            PUSHED_BY BUILD_DATE RUN_ID RUN_URL RUST_VERSION \
            COMMIT_COUNT_SINCE_LAST_BUILD COMMITS_SINCE_LAST_BUILD \
            CONTRIBUTORS_SINCE_LAST_BUILD CHANGED_FILES_COUNT \
            ARTIFACT_COUNT ARTIFACT_LIST

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Dev build ${{ steps.ver.outputs.tag }}"
          prerelease: true
          body_path: release-body.md
          files: release-assets/*
